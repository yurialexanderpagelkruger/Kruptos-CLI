<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="Kruptos encryption on Windows PowerShell">
  <rect width="900" height="540" rx="14" fill="#0c0c0c"/>
  <rect width="900" height="42" rx="14" fill="#1f1f1f"/>
  <rect y="28" width="900" height="14" fill="#1f1f1f"/>
  <circle cx="24" cy="21" r="7" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="7" fill="#ffbd2e"/>
  <circle cx="72" cy="21" r="7" fill="#27c93f"/>
  <text x="96" y="26" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="14">Windows PowerShell — kruptos</text>
  <text x="26" y="82" xml:space="preserve" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="16">
    <tspan x="26" dy="0" fill="#4fc1ff">PS C:\Users\demo&gt; <tspan fill="#e6edf3">kruptos encrypt -m "Hello world"</tspan></tspan>
    <tspan x="26" dy="24" fill="#4ec9b0">[+] Message encrypted with 10 layers in a different order:</tspan>
    <tspan x="26" dy="24" fill="#e6edf3">      1.   base64            Encoding</tspan>
    <tspan x="26" dy="24" fill="#e6edf3">      2.   chacha20          Cipher</tspan>
    <tspan x="26" dy="24" fill="#e6edf3">      3.   percent           Encoding</tspan>
    <tspan x="26" dy="24" fill="#e6edf3">      4.   rc4               Cipher</tspan>
    <tspan x="26" dy="24" fill="#8b949e">      ...</tspan>
    <tspan x="26" dy="24" fill="#4fc1ff">[*] Plan ID (keep it with the ciphertext):</tspan>
    <tspan x="26" dy="24" fill="#8b949e">KR1-AEAAUIYB-FAQCUCAK-AQBCOUKY-5UV73CWO-...</tspan>
    <tspan x="26" dy="24" fill="#4fc1ff">[*] Seed fingerprint: 3d694c2e</tspan>
    <tspan x="26" dy="24" fill="#4fc1ff">[*] Ciphertext:</tspan>
    <tspan x="26" dy="24" fill="#8b949e">%CDJ%11i%DC%AD%3FP%C1mP%15o%EE%C6%BD%C1%26N...</tspan>
    <tspan x="26" dy="24" fill="#dcdcaa">[!] Without the ID the message cannot be recovered.</tspan>
  </text>
  <text x="26" y="516" fill="#6e7681" font-family="Segoe UI, Arial, sans-serif" font-size="12">Kruptos 1.0.0 · C++20 · static binary · Windows x64</text>
</svg>
