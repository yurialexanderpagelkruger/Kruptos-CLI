name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: .\build\Release\kruptos.exe --lang en selftest

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item .\build\Release\kruptos.exe .\dist\kruptos.exe
          Copy-Item .\install.ps1 .\dist\install.ps1
          Copy-Item .\install.cmd .\dist\install.cmd
          Copy-Item .\README.md .\dist\LEEME.md
          Compress-Archive -Path .\dist\* -DestinationPath Kruptos-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Kruptos-windows-x64
          path: Kruptos-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Configure static
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKRUPTOS_STATIC=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ./build/kruptos --lang en selftest

      - name: Check static
        run: |
          file build/kruptos
          ldd build/kruptos || true

      - name: Package
        run: |
          mkdir -p dist
          cp build/kruptos dist/
          cp install.sh dist/
          chmod +x dist/kruptos dist/install.sh
          tar -czf Kruptos-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: Kruptos-linux-x86_64
          path: Kruptos-linux-x86_64.tar.gz
